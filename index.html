<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold'em Table</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hold'em">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:rgba(255,255,255,.86); --solid:#FFFFFF; --text:#121815; --muted:#5A6760; --line:rgba(18,24,21,.12);
  --accent:#C99A3B; --raise:#D2453A; --good:#2E8B57; --bad:#C23B2E;
  --beg:#41B06E; --reg:#4C8DF0; --tgh:#F0644E;
  --s-s:#16181A; --s-h:#D0142F; --s-d:#1E63D0; --s-c:#1E8A40;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --felt-text:#EAF3EE; --felt-muted:rgba(234,243,238,.7); --chip:#E9B949; --chip-text:#1B1408;
  --back-bg:#7A2A22; --back-border:#F3E9D8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0C1210;--surface:rgba(22,30,27,.84);--solid:#161E1B;--text:#EAF0EC;--muted:#9AABA2;--line:rgba(234,240,236,.12);color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0C1210;--surface:rgba(22,30,27,.84);--solid:#161E1B;--text:#EAF0EC;--muted:#9AABA2;--line:rgba(234,240,236,.12);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 12px 24px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.02;letter-spacing:-.02em}
h1{font-size:2.4rem}
h2{font-size:1.35rem}
h3{font-family:var(--display);font-weight:700;font-size:1rem;margin:16px 0 6px}
.muted{color:var(--muted)}
.glass{background:var(--surface);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.btn{padding:12px 16px;border-radius:14px;border:0;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--text);color:var(--solid)}
.btn.brass{background:var(--accent);color:#1B1408}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.pill{padding:8px 13px;border-radius:999px;font-size:.88rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--solid);border-color:var(--text)}

/* atmosphere layer */
#atm{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
#atm .fx1,#atm .fx2{position:absolute;inset:-10%;}

/* lobby */
.lobby header{margin:18px 2px 8px}
.panel{border-radius:22px;padding:16px;margin:12px 0}
.panel p{margin:4px 0 10px}
.bank{font-family:var(--display);font-weight:800;font-size:3rem;letter-spacing:-.03em;margin:4px 0 0;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1 1 140px}
.lbl{font-weight:700;font-size:.85rem;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table.st{border-collapse:collapse;width:100%;font-size:.95rem}
table.st td{padding:7px 0;border-bottom:1px solid var(--line)}
table.st td:last-child{text-align:right;font-weight:700}
.lookrow{display:flex;gap:12px;align-items:center}
.lookprev{flex:none;width:120px;height:78px;border-radius:40px/30px;position:relative}

/* game top bar */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;border-radius:18px;padding:6px}
.topbar .info{flex:1;min-width:0;font-size:.8rem;color:var(--muted);line-height:1.25;text-align:center}
.topbar .info b{color:var(--text)}

/* felt */
.felt{position:relative;height:376px;border-radius:46%/38%;margin:20px 0 10px;color:var(--felt-text);isolation:isolate}
.felt::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1}
.felt .logo{position:absolute;left:50%;top:63%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.35em;text-transform:uppercase;color:var(--felt-muted);opacity:.35;white-space:nowrap}
.seat{position:absolute;width:104px;text-align:center;font-size:.76rem;line-height:1.15;transition:opacity .25s ease}
.seat .scards{display:flex;justify-content:center;gap:2px;height:36px;margin-bottom:-8px;position:relative;z-index:1}
.seat .plate{position:relative;display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:14px;background:rgba(8,10,12,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);text-align:left;transition:box-shadow .2s ease,border-color .2s ease}
.av{flex:none;width:30px;height:30px;overflow:hidden;border:2px solid rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:.75rem;color:#0c0f0d;background:#ccc}
.av.beginner{background:var(--beg)}.av.regular{background:var(--reg)}.av.tough{background:var(--tgh)}
.meta{min-width:0}
.seat .nm{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stk{color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92em}
.seat .tag{min-height:1.3em;margin-top:3px;font-weight:700;font-size:.72rem;color:#FFE4A6;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat .bet{display:inline-block;margin-top:2px;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:1px 9px;font-weight:800;font-size:.76rem;font-family:var(--display);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.seat.turn .plate{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(233,185,73,.45)}
.seat.win .plate{border-color:#7BE3A6;box-shadow:0 0 0 2px #7BE3A6,0 0 18px rgba(123,227,166,.5)}
.seat.folded{opacity:.42}
.seat.out{opacity:.25}
.dealer{position:absolute;z-index:3;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-family:var(--display);font-weight:800;font-size:.7rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45);border:2px solid var(--accent);transition:left .45s ease,top .45s ease,right .45s ease,bottom .45s ease}
.center{position:absolute;left:50%;top:116px;transform:translateX(-50%);text-align:center;width:232px}
.board{display:flex;justify-content:center;gap:5px;height:52px}
.slot{width:38px;height:52px;border-radius:7px;border:1px dashed rgba(255,255,255,.2)}
.slot.has{border:0}
.pot{font-family:var(--display);font-weight:800;margin-top:8px;font-size:1rem;color:var(--felt-text)}
.status{font-size:.8rem;color:var(--felt-muted);margin-top:2px;min-height:2.4em;line-height:1.2}

/* playing cards */
.pc{position:relative;border-radius:var(--pc-r,6px);background:#FBFAF6;box-shadow:0 2px 6px rgba(0,0,0,.35);overflow:hidden;font-family:var(--face-font,var(--display));font-weight:700;user-select:none}
.pc .r{position:absolute;line-height:1}
.pc .s{position:absolute;line-height:1}
.pc .pip{position:absolute;line-height:1}
.pc.back{background:var(--back-bg);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 0 0 var(--back-bw,2px) var(--back-border)}
.pc.xs{width:24px;height:34px;--pc-r:4px}
.pc.sm{width:38px;height:52px;--pc-r:6px}
.pc.lg{width:62px;height:88px;--pc-r:9px}
.pc.deal{animation:deal .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{transform:translateY(-14px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.c-s{color:var(--s-s)}.c-h{color:var(--s-h)}.c-d{color:var(--s-d)}.c-c{color:var(--s-c)}

/* hero */
.hero{border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:14px;transition:box-shadow .2s ease}
.hero.turn{box-shadow:0 0 0 2px var(--accent),0 10px 30px rgba(0,0,0,.15)}
.hero.win{box-shadow:0 0 0 2px var(--good),0 10px 30px rgba(0,0,0,.15)}
.hcards{display:flex;gap:0;min-width:120px;height:92px;align-items:center}
.hinfo{flex:1;min-width:0}
.hinfo .nm{font-weight:700;font-size:.85rem;color:var(--muted)}
.hinfo .stk{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hinfo .sub{font-size:.88rem;color:var(--muted)}
.hinfo .act{font-weight:700;color:var(--accent);font-size:.88rem;min-height:1.2em}

/* controls */
.controls{position:sticky;bottom:0;z-index:4;padding:10px 0 4px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions.one{grid-template-columns:1fr}
.actions .btn{padding:15px 6px;border-radius:16px;font-size:1.02rem}
.b-fold{background:var(--surface);border:1px solid var(--line)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.b-call{background:var(--text);color:var(--solid)}
.b-raise{background:var(--raise);color:#fff}
.raisebox{border-radius:18px;padding:12px;margin-top:8px}
.raisebox .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.raisebox .presets button{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.82rem;cursor:pointer}
.raisebox input[type=range]{width:100%;accent-color:var(--raise)}
.raisebox .amt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.raisebox .amt b{font-family:var(--display);font-weight:800;font-size:1.5rem}
.waiting{text-align:center;color:var(--muted);padding:15px 10px;border-radius:16px;font-size:.95rem}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,8,7,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--solid);color:var(--text);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3);max-width:560px;margin:0 auto}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.tool{border-top:1px solid var(--line);padding:10px 0}
.tool .k{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tool .v{font-size:1.02rem}
.big{font-family:var(--display);font-weight:800;font-size:1.6rem}
.advice{background:var(--text);color:var(--solid);border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.advice b{color:var(--accent)}
.formula{background:rgba(201,154,59,.1);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:8px 12px;margin:6px 0;font-size:.92rem}
.reflist{list-style:none;padding:0;margin:4px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,auto);grid-auto-flow:column;gap:1px 20px}
.reflist li{font-family:var(--display);font-weight:700;font-size:1.1rem;padding:2px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.6em 1fr}
.reflist li.me{background:rgba(201,154,59,.2);border-radius:4px}
.hc{color:var(--accent);border-right:2px solid var(--accent);margin-right:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.beginner{background:var(--beg)}.dot.regular{background:var(--reg)}.dot.tough{background:var(--tgh)}
.log{font-size:.85rem;color:var(--muted);max-height:180px;overflow-y:auto;margin:0;padding-left:1.2em}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;background:var(--solid);color:var(--text);border-radius:22px;padding:20px;width:min(92vw,400px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal p{margin:8px 0 14px}

/* style picker */
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.88rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--solid)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:2px solid transparent;border-radius:16px;padding:6px;background:transparent;cursor:pointer;text-align:center;font-size:.78rem;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(201,154,59,.08)}
.opt .pv{height:70px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:5px}
.opt .tv{width:92%;height:56px;border-radius:50%/50%;position:relative}
.preview{border-radius:20px;height:150px;position:relative;overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.preview .ptable{width:86%;height:110px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:12px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:23px}

/* world */
.ltabs{margin:4px 0 4px;position:sticky;top:6px;z-index:5;padding:6px;border-radius:16px;background:var(--surface);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line)}
.prof .profrow{display:flex;gap:12px;align-items:center}
.lvl{flex:none;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--accent),#f3d27a);color:#1B1408;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1}
.lvl span{font-size:.6rem;letter-spacing:.12em}
.ttl{font-family:var(--display);font-weight:800;font-size:1.3rem}
.xpbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f3d27a);border-radius:999px}
.prof .bank{margin-top:14px}
.ev h2{font-size:1.25rem}
.ev.locked{opacity:.72}
.ev.active{box-shadow:0 0 0 2px var(--accent),0 10px 30px rgba(0,0,0,.12)}
.evtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.venue{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tier{flex:none;font-family:var(--display);font-weight:800;font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--text);color:var(--solid)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chips span{font-size:.8rem;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.evmeta{font-size:.85rem;margin-top:4px}
.lock{flex:1;text-align:center;padding:11px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:.9rem}
.trophies{display:grid;gap:8px;margin-top:8px}
.trophy{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(201,154,59,.1)}
.trophy .cup{font-size:1.6rem}
.achgrid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);opacity:.6}
.ach.on{opacity:1;border-color:var(--accent);background:rgba(201,154,59,.08)}
.ach .ai{font-size:1.2rem;color:var(--accent);line-height:1.2}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);z-index:20;background:var(--text);color:var(--solid);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{animation:toastin 2.5s ease both}
@keyframes toastin{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
.opt[disabled]{opacity:.55;cursor:default}
.opt .lk{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.av svg{width:100%;height:100%;display:block}
.av.beginner{border-color:var(--beg)}.av.regular{border-color:var(--reg)}.av.tough{border-color:var(--tgh)}
.seat .plate{cursor:pointer}
.bubble{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);z-index:6;background:#fff;color:#141414;font-size:.72rem;font-weight:700;line-height:1.2;padding:6px 9px;border-radius:12px;width:max-content;max-width:150px;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:pop .25s ease both}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.pcard{display:flex;gap:14px;align-items:center}
.pav{flex:none;width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.pav svg{width:100%;height:100%;display:block}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0 4px}
.lu{text-align:center;font-size:.68rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.luav{width:52px;height:52px;border-radius:14px;overflow:hidden}
.luav svg{width:100%;height:100%;display:block}
.theme{font-size:.82rem;margin-top:6px;padding:6px 10px;border-radius:10px;background:rgba(201,154,59,.12)}
input,select{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--text);min-width:0;flex:1 1 90px;font-size:1rem}
.ltabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:0 0 auto;padding:10px 14px}
.felt.ring9{height:404px}
.felt.ring9 .seat{width:84px;font-size:.66rem}
.felt.ring9 .av{width:24px;height:24px}
.felt.ring9 .center{top:146px}
.felt.ring9 .logo{top:74%}
.felt.ring9 .pc.sm,.felt.ring9 .slot{width:33px;height:46px}
.felt.ring9 .board{height:46px}
.flychip{position:absolute;z-index:7;width:18px;height:18px;border-radius:50%;background:var(--chip);border:3px dashed rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .45s ease;pointer-events:none}
.potchips{display:inline-flex;gap:3px;align-items:flex-end;justify-content:center;min-height:34px;flex-wrap:wrap;max-width:220px}

/* ===== fair dealing, deck seal, luck check ===== */
function rndC(n){if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1),lim=4294967296-(4294967296%n);do{crypto.getRandomValues(a);}while(a[0]>=lim);return a[0]%n;}return rnd(n);}

function cardCode(c){return rankCh(c)+suitCh(c);}
function sealDeck(h){
  /* deck order is fixed before any card is dealt; the hash is shown now and the order plus salt after the hand */
  var salt="";for(var i=0;i<8;i++)salt+=rndC(16).toString(16);
  h.salt=salt;h.order=h.deck.slice().reverse().map(cardCode).join(" ");
  if(!(window.crypto&&crypto.subtle))return;
  try{crypto.subtle.digest("SHA-256",new TextEncoder().encode(h.order+"|"+salt)).then(function(b){h.seal=hex(b);}).catch(function(){});}catch(e){}
}
function shareAt(board,hero,opps){var me=evaluate(hero.concat(board)),best=me,tie=1;
  for(var k=0;k<opps.length;k++){var v=evaluate(opps[k].concat(board));if(v>best){return 0;}if(v===me)tie++;}
  return 1/tie;}
function luckCheck(){

var LEAKS={
 fold_chart:["Folded a chart hand","You folded a hand that's in your opening chart for that seat. Those hands make money long term, so open them."],
 open_loose:["Opened outside the chart","You raised first in with a hand that isn't in your chart. Tighten up, especially from early seats."],
 limp:["Limped in","You just called the big blind instead of raising or folding. Limping invites everyone in and gives up the initiative."],

 fold_strong_pre:["Folded a strong hand to a raise","You folded to a raise with a hand that had enough equity to continue."],
 call_no_odds:["Called without the odds","Your equity was below what the bet asked for. Over time these calls lose money."],
 fold_odds:["Folded with the odds","You had more equity than the bet asked for, so calling would have made money long term."],
 missed_value:["Checked a strong hand","You checked when you were well ahead. Bet for value, because loose players will pay you."],
 bluff_multi:["Bluffed into a crowd","You bet a weak hand into two or more players. Someone almost always has something. Bluff one opponent at a time."],
 missed_raise:["Just called a monster","You were far ahead of their range and only called. Raising builds the pot when you're strong."]
};
function classify(d){
  if(d.st===0){
    if(d.raises===0&&d.pos!=="BB"){
      if(d.act==="fold"&&(d.advice==="Raise"||d.advice==="Push all in"))return "fold_chart";
      if(d.act==="raise"&&d.advice!=="Raise"&&d.advice!=="Push all in")return "open_loose";
      if(d.act==="call"&&d.toCall>0)return "limp";
      return null;}
    if(d.raises>0){
      if((d.act==="call"||d.act==="raise")&&d.advice==="Fold")return "call_light_pre";
      if(d.act==="fold"&&(d.advice==="Call"||d.advice==="Reraise"))return "fold_strong_pre";}
    return null;}
  if(d.toCall>0){
    if(d.act==="call"&&d.eq<d.need-0.05)return "call_no_odds";
    if(d.act==="fold"&&d.eq>d.need+0.08)return "fold_odds";
    if(d.act==="call"&&d.eq>=0.75&&d.canRaise)return "missed_raise";
    return null;}
  if(d.act==="check"&&d.eq>=0.7)return "missed_value";
  if(d.act==="raise"&&d.eq<0.3&&d.nOpp>=2)return "bluff_multi";
  return null;
}

    if(rec.act==="fold"&&rec.toCall>0&&rec.eq<rec.need)mission("goodfold");if(rec.act==="fold"&&rec.st===3&&rec.advice==="Fold")mission("riverfold");
    if(rec.st===0&&rec.act==="raise"&&rec.raises===1&&H.preAgg>0){var opn=T.players[H.preAgg];if(opn&&(["station","limper","whale","maniac"].indexOf(opn.arch)>=0||opn.cid==="moonshot"))mission("3bloose");}

}

  var mn=Math.min(0,Math.min.apply(null,pts)),mx=Math.max(0,Math.max.apply(null,pts)),W=320,Hh=110,sx=W/(pts.length-1),sy=function(v){return Hh-8-(v-mn)/((mx-mn)||1)*(Hh-16);};
  var d=pts.map(function(v,i){return (i?"L":"M")+(i*sx).toFixed(1)+" "+sy(v).toFixed(1);}).join(" ");
  return "<svg viewBox='0 0 "+W+" "+Hh+"' style='width:100%;height:auto;margin-top:8px' role='img' aria-label='Running results'><line x1='0' x2='"+W+"' y1='"+sy(0)+"' y2='"+sy(0)+"' stroke='currentColor' stroke-opacity='.2' stroke-dasharray='4 4'/><path d='"+d+"' fill='none' stroke='"+(run>=0?"#2E8B57":"#C23B2E")+"' stroke-width='2.5' stroke-linejoin='round'/></svg>";
}

function handName(v){var c=catOf(v),k=[];for(var i=4;i>=0;i--)k.push(Math.floor(v/Math.pow(13,i))%13);

  if(c===6)return RN[k[0]]+" full of "+RN[k[1]];if(c===7)return "four "+RN[k[0]];return k[0]===12?"a royal flush":"a straight flush, "+RS[k[0]]+" high";}

function moodify(a,mood){if(!mood)return a;a=Object.assign({},a);
  var keepEyes=["shades","glasses","monocle","cateye"].indexOf(a.eyes)>=0;
  if(mood==="win"){a.mouth="grin";if(!keepEyes)a.eyes="squint";a.brows="normal";a.blush=true;}
  else if(mood==="sweat"){a.brows="worried";a.mouth="o";if(!keepEyes)a.eyes="wide";}
  else if(mood==="tilt"){a.brows="angry";a.mouth="frown";}
  else if(mood==="sad"){a.brows="worried";a.mouth="frown";}
  return a;}

  return 0.06+rk[0]/12*0.16;}

  var fl=Object.keys(su).find(function(k){return su[k].length===4;}),u=Object.keys(cnt).map(Number).sort(function(a,b){return a-b;});

    var wheel=u.filter(function(r){return r===12||r<=3;});if(!oe&&wheel.length>=4)gs=gs||wheel.slice(0,4);}
  return {flush:fl?su[fl]:null,oe:oe,gs:gs};}
function dwBestDiscard(cs,p){var v=evaluate(cs),cat=catOf(v),rk=dwRanks(cs),cnt={};rk.forEach(function(r){cnt[r]=(cnt[r]||0)+1;});
  var idx=function(pred){var o=[];cs.forEach(function(c,i){if(pred(c,i))o.push(i);});return o;};
  if(cat>=4)return {d:[],why:"A made hand of five cards. Stand pat."};
  if(cat===7)return {d:[],why:"Four of a kind. Stand pat."};
  if(cat===3){var t=+Object.keys(cnt).find(function(k){return cnt[k]===3;});return {d:idx(function(c){return (c>>2)!==t;}),why:"Keep the three of a kind and draw two. About 1 in 10 to make a full house or better."};}
  if(cat===2){return {d:idx(function(c){return cnt[c>>2]===1;}),why:"Keep two pair and draw one. About 1 in 12 (8.5%) to make a full house."};}
  var di=dwDrawInfo(cs);
  if(di.flush)return {d:idx(function(c){return di.flush.indexOf(c)<0;}),why:"Four to a flush: draw one. About 19% to hit."};
  if(cat===1){var pr=+Object.keys(cnt).find(function(k){return cnt[k]===2;});
    if(di.oe&&pr<6)return {d:idx(function(c,i){return di.oe.indexOf(c>>2)<0||rk.indexOf(c>>2)!==i;}),why:"A small pair is worth less than an open-ended straight draw. Draw one: about 17% to hit."};
    return {d:idx(function(c){return (c>>2)!==pr;}),why:"Keep the pair and draw three. About 29% to improve, mostly to two pair or trips."};}
  if(di.oe)return {d:idx(function(c,i){return di.oe.indexOf(c>>2)<0||rk.indexOf(c>>2)!==i;}),why:"Open-ended straight draw: draw one. About 17% to hit."};

  var hi=Math.max.apply(null,rk);if(hi===12)return {d:idx(function(c){return (c>>2)!==12;}).slice(0,4),why:"Nothing but an ace. Keep the ace and draw four."};

    css+=".face-"+f.id+" .pc{--face-font:"+f.font+";"+(f.card||"")+"}";
    f.css.split("}").forEach(function(rule){if(!rule.trim())return;css+=".face-"+f.id+" .pc "+rule+"}";});
    if(f.colors)Object.keys(f.colors).forEach(function(k){css+=".face-"+f.id+" .c-"+k+"{color:"+f.colors[k]+"}";});
  });
  css+=".pc.xs{font-size:12px}.pc.sm{font-size:17px}.pc.lg{font-size:27px}";
  Object.keys(FXCSS).forEach(function(k){css+=FXCSS[k].replace(/\.fx1/g,"#atm.fx-"+k+" .fx1").replace(/\.fx2/g,"#atm.fx-"+k+" .fx2");css+=FXCSS[k].replace(/\.fx1/g,".fxp-"+k+" .fx1").replace(/\.fx2/g,".fxp-"+k+" .fx2");});
  css+=".pv .fx1,.pv .fx2,.preview .fx1,.preview .fx2{position:absolute;inset:-10%;pointer-events:none}.preview .ptable{z-index:1}";
  $("looks").textContent=css;
}
function applyLook(ov){
  var L=look(),t=byId(TABLES,ov&&ov.table||L.table),b=byId(BACKS,L.back),a=byId(ATMOS,ov&&ov.atm||L.atm);
  if(!okItem(t))t=TABLES[0];if(!okItem(b))b=BACKS[0];if(!okItem(a))a=ATMOS[0];
  document.body.className="face-"+L.face+(L.fx?"":" nofx");
  var rs=document.documentElement.style;
  rs.setProperty("--back-bg",b.bg);rs.setProperty("--back-border",b.bc);rs.setProperty("--back-bw",b.bw||"2px");
  var atm=$("atm");atm.style.background=a.bg;atm.className=a.fx?"fx-"+a.fx:"";
  var felt=$("felt");if(felt){
    var fb=felt.querySelector(".feltbg");if(!fb){fb=document.createElement("div");fb.className="feltbg";fb.setAttribute("style","position:absolute;inset:0;border-radius:inherit;z-index:-1");felt.insertBefore(fb,felt.firstChild);}
    fb.style.background=(S.settings.tilt3d?"radial-gradient(ellipse at 50% 22%,rgba(255,255,255,.16),transparent 55%),":"")+t.bg;fb.style.boxShadow=t.sh;
    felt.style.setProperty("--felt-text",t.text||"#EEF5F0");felt.style.setProperty("--felt-muted",t.muted||"rgba(238,245,240,.72)");
    felt.style.setProperty("--chip",t.chip||"#E9B949");felt.style.setProperty("--chip-text",t.chipText||"#1B1408");
    $("g-logo").textContent=t.logo||"";
  }
  var lp=$("l-lookprev");if(lp){lp.setAttribute("style","background:"+t.bg+";box-shadow:"+t.sh.replace(/9px/g,"5px").replace(/11px/g,"6px").replace(/14px/g,"6px").replace(/15px/g,"7px").replace(/17px/g,"8px"));
    lp.innerHTML="<div style='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:3px'><div class='pc xs back'></div>"+pcHTML(48,"xs")+"</div>";}
  if($("l-lookname"))$("l-lookname").textContent=t.n+" \u00b7 "+b.n+" backs \u00b7 "+byId(FACES,L.face).n+" cards \u00b7 "+a.n;
}
function pcHTML(c,size,deal){var r=rankCh(c)==="T"?"10":rankCh(c),su=suitCh(c);return "<div class='pc "+size+" c-"+su+(deal?" deal":"")+"'><span class='r'>"+r+"</span><span class='s'>"+SYM[su]+"</span><span class='pip'>"+SYM[su]+"</span></div>";}
var LOOKTAB="table";
function railSmall(sh){return sh.replace(/9px/g,"4px").replace(/11px/g,"5px").replace(/14px/g,"5px").replace(/15px/g,"6px").replace(/17px/g,"7px").replace(/0 18px 40px rgba\(0,0,0,\.[0-9]+\)/g,"0 4px 10px rgba(0,0,0,.3)");}
function renderLook(){
  var L=look(),t=byId(TABLES,L.table),a=byId(ATMOS,L.atm);
  $("look-preview").setAttribute("style","background:"+a.bg);$("look-preview").className="preview"+(a.fx?" fxp-"+a.fx:"");
  $("look-preview").innerHTML="<div class='fx1'></div><div class='fx2'></div><div class='ptable' style='background:"+t.bg+";box-shadow:"+railSmall(t.sh)+"'><div class='pc sm back'></div><div class='pc sm back'></div>"+pcHTML(48,"sm")+pcHTML(43,"sm")+pcHTML(34,"sm")+"</div>";
  var tabs=[["table","Tables",TABLES.length],["back","Card backs",BACKS.length],["face","Card faces",FACES.length],["atm","Atmosphere",ATMOS.length]];
  $("look-tabs").innerHTML=tabs.map(function(x){return "<button role='tab' data-t='"+x[0]+"' aria-selected='"+(LOOKTAB===x[0])+"'>"+x[1]+" <span class='muted'>"+x[2]+"</span></button>";}).join("");
  var h="<div class='grid'>";
  function lk(o){return okItem(o)?"":" disabled";}function lt(o){return okItem(o)?"":"<span class='lk'>\ud83d\udd12 "+achName(o.lock)+"</span>";}
  if(LOOKTAB==="table")TABLES.forEach(function(o){h+="<button class='opt' data-k='table' data-v='"+o.id+"' aria-pressed='"+(L.table===o.id)+"'"+lk(o)+"><div class='pv'><div class='tv' style='background:"+o.bg+";box-shadow:"+railSmall(o.sh)+"'></div></div>"+o.n+lt(o)+"</button>";});
  if(LOOKTAB==="back")BACKS.forEach(function(o){h+="<button class='opt' data-k='back' data-v='"+o.id+"' aria-pressed='"+(L.back===o.id)+"'"+lk(o)+"><div class='pv'><div class='pc sm' style='background:"+o.bg+";box-shadow:inset 0 0 0 "+(o.bw||"2px")+" "+o.bc+",0 2px 6px rgba(0,0,0,.3)'></div><div class='pc sm' style='background:"+o.bg+";box-shadow:inset 0 0 0 "+(o.bw||"2px")+" "+o.bc+",0 2px 6px rgba(0,0,0,.3);transform:rotate(8deg)'></div></div>"+o.n+lt(o)+"</button>";});
  if(LOOKTAB==="face")FACES.forEach(function(o){h+="<button class='opt face-"+o.id+"' data-k='face' data-v='"+o.id+"' aria-pressed='"+(L.face===o.id)+"'><div class='pv' style='background:rgba(29,82,64,.9)'>"+pcHTML(48,"sm")+pcHTML(42,"sm")+pcHTML(13,"sm")+"</div>"+o.n+"</button>";});
  if(LOOKTAB==="atm")ATMOS.forEach(function(o){h+="<button class='opt' data-k='atm' data-v='"+o.id+"' aria-pressed='"+(L.atm===o.id)+"'"+lk(o)+"><div class='pv"+(o.fx?" fxp-"+o.fx:"")+"' style='background:"+o.bg+"'><div class='fx1'></div><div class='fx2'></div></div>"+o.n+lt(o)+"</button>";});
  h+="</div>";
  if(LOOKTAB==="atm")h+="<div class='toggle'><div><b>Moving effects</b><div class='muted' style='font-size:.85rem'>Rain, snow, lights, smoke. Off saves battery.</div></div><button class='switch' role='switch' id='look-fx' aria-checked='"+(!!L.fx)+"' aria-label='Moving effects'></button></div>";
  $("look-body").innerHTML=h;
  $("look-tabs").querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){LOOKTAB=b.dataset.t;renderLook();};});
  $("look-body").querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){if(b.disabled)return;look()[b.dataset.k]=b.dataset.v;
    if(T&&S.settings.venueLooks&&(b.dataset.k==="table"||b.dataset.k==="atm")){S.settings.venueLooks=false;toast("Venue looks off, using your look");}
    save();applyLook(T?venueLook():null);renderLook();};});
  if($("look-fx"))$("look-fx").onclick=function(){L.fx=!L.fx;save();applyLook(T?venueLook():null);renderLook();};
}
function openLook(){closeTools();renderLook();$("scrim").hidden=false;$("lookSheet").hidden=false;$("look-close").focus({preventScroll:true});}
function closeLook(){$("lookSheet").hidden=true;if($("modal").hidden&&$("tools").hidden)$("scrim").hidden=true;}
$("look-close").onclick=closeLook;
$("look-rand").onclick=function(){var L=look(),ok=function(a){return a.filter(okItem);};L.table=pick(ok(TABLES)).id;L.back=pick(ok(BACKS)).id;L.face=pick(FACES).id;L.atm=pick(ok(ATMOS)).id;if(T)S.settings.venueLooks=false;save();applyLook(T?venueLook():null);renderLook();};
$("g-style").onclick=openLook;
buildLookCSS();applyLook();

renderLobby();
})();

</script>

  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});

if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
