:root[data-theme="dark"]{--bg:#0C1210;--surface:rgba(22,30,27,.84);--solid:#161E1B;--text:#EAF0EC;--muted:#9AABA2;--line:rgba(234,240,236,.12);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 12px 24px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.02;letter-spacing:-.02em}
h1{font-size:2.4rem}
h2{font-size:1.35rem}
h3{font-family:var(--display);font-weight:700;font-size:1rem;margin:16px 0 6px}
.muted{color:var(--muted)}
.glass{background:var(--surface);-webkit-backdrop- saturate(1.2);backdrop- saturate(1.2);border:1px solid var(--line);box-shadow:0 4px 0 rgba(13,11,23,.45)}
.btn{padding:12px 16px;border-radius:14px;border:0;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--text);color:var(--solid)}
.btn.brass{background:var(--accent);color:#1B1408}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.pill{padding:8px 13px;border-radius:999px;font-size:.88rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--solid);border-color:var(--text)}

/* atmosphere layer */
#atm{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
#atm .fx1,#atm .fx2{position:absolute;inset:-10%;}

/* lobby */
.lobby header{margin:18px 2px 8px}
.panel{border-radius:22px;padding:16px;margin:12px 0}
.panel p{margin:4px 0 10px}
.bank{font-family:var(--display);font-weight:800;font-size:3rem;letter-spacing:-.03em;margin:4px 0 0;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1 1 140px}
.lbl{font-weight:700;font-size:.85rem;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table.st{border-collapse:collapse;width:100%;font-size:.95rem}
table.st td{padding:7px 0;border-bottom:1px solid var(--line)}
table.st td:last-child{text-align:right;font-weight:700}
.lookrow{display:flex;gap:12px;align-items:center}
.lookprev{flex:none;width:120px;height:78px;border-radius:40px/30px;position:relative}

/* game top bar */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;border-radius:18px;padding:6px}
.topbar .info{flex:1;min-width:0;font-size:.8rem;color:var(--muted);line-height:1.25;text-align:center}
.topbar .info b{color:var(--text)}

/* felt */
.felt{position:relative;height:376px;border-radius:46%/38%;margin:20px 0 10px;color:var(--felt-text);isolation:isolate}
.felt::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1}
.felt .logo{position:absolute;left:50%;top:63%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.35em;text-transform:uppercase;color:var(--felt-muted);opacity:.35;white-space:nowrap}
.seat{position:absolute;width:104px;text-align:center;font-size:.76rem;line-height:1.15;transition:opacity .25s ease}
.seat .scards{display:flex;justify-content:center;gap:2px;height:36px;margin-bottom:-8px;position:relative;z-index:1}
.seat .plate{position:relative;display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:14px;background:rgba(8,10,12,.62);-webkit-backdrop-backdrop-border:1px solid rgba(255,255,255,.12);text-align:left;transition:box-shadow .2s ease,border-color .2s ease}
.av{flex:none;width:30px;height:30px;overflow:hidden;border:2px solid rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:.75rem;color:#0c0f0d;background:#ccc}
.av.beginner{background:var(--beg)}.av.regular{background:var(--reg)}.av.tough{background:var(--tgh)}
.meta{min-width:0}
.seat .nm{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stk{color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92em}
.seat .tag{min-height:1.3em;margin-top:3px;font-weight:700;font-size:.72rem;color:#FFE4A6;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat .bet{display:inline-block;margin-top:2px;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:1px 9px;font-weight:800;font-size:.76rem;font-family:var(--display);box-shadow:0 4px 0 rgba(13,11,23,.45)}
.seat.turn .plate{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.seat.win .plate{border-color:#7BE3A6;box-shadow:0 0 0 2px #7BE3A6}
.seat.folded{opacity:.42}
.seat.out{opacity:.25}
.dealer{position:absolute;z-index:3;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-family:var(--display);font-weight:800;font-size:.7rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(13,11,23,.45);border:2px solid var(--accent);transition:left .45s ease,top .45s ease,right .45s ease,bottom .45s ease}
.center{position:absolute;left:50%;top:116px;transform:translateX(-50%);text-align:center;width:232px}
.board{display:flex;justify-content:center;gap:5px;height:52px}
.slot{width:38px;height:52px;border-radius:7px;border:1px dashed rgba(255,255,255,.2)}
.slot.has{border:0}
.pot{font-family:var(--display);font-weight:800;margin-top:8px;font-size:1rem;color:var(--felt-text)}
.status{font-size:.8rem;color:var(--felt-muted);margin-top:2px;min-height:2.4em;line-height:1.2}

/* playing cards */
.pc{position:relative;border-radius:var(--pc-r,6px);background:#FBFAF6;box-shadow:0 4px 0 rgba(13,11,23,.45);overflow:hidden;font-family:var(--face-font,var(--display));font-weight:700;user-select:none}
.pc .r{position:absolute;line-height:1}
.pc .s{position:absolute;line-height:1}
.pc .pip{position:absolute;line-height:1}
.pc.back{background:var(--back-bg);box-shadow:0 4px 0 rgba(13,11,23,.45),inset 0 0 0 var(--back-bw,2px) var(--back-border)}
.pc.xs{width:24px;height:34px;--pc-r:4px}
.pc.sm{width:38px;height:52px;--pc-r:6px}
.pc.lg{width:62px;height:88px;--pc-r:9px}
.pc.deal{animation:deal .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{transform:translateY(-14px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.c-s{color:var(--s-s)}.c-h{color:var(--s-h)}.c-d{color:var(--s-d)}.c-c{color:var(--s-c)}

/* hero */
.hero{border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:14px;transition:box-shadow .2s ease}
.hero.turn{box-shadow:0 0 0 2px var(--accent),0 4px 0 rgba(13,11,23,.45)}
.hero.win{box-shadow:0 0 0 2px var(--good),0 4px 0 rgba(13,11,23,.45)}
.hcards{display:flex;gap:0;min-width:120px;height:92px;align-items:center}
.hinfo{flex:1;min-width:0}
.hinfo .nm{font-weight:700;font-size:.85rem;color:var(--muted)}
.hinfo .stk{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hinfo .sub{font-size:.88rem;color:var(--muted)}
.hinfo .act{font-weight:700;color:var(--accent);font-size:.88rem;min-height:1.2em}

/* controls */
.controls{position:sticky;bottom:0;z-index:4;padding:10px 0 4px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions.one{grid-template-columns:1fr}
.actions .btn{padding:15px 6px;border-radius:16px;font-size:1.02rem}
.b-fold{background:var(--surface);border:1px solid var(--line)!important;-webkit-backdrop-backdrop-}
.b-call{background:var(--text);color:var(--solid)}
.b-raise{background:var(--raise);color:#fff}
.raisebox{border-radius:18px;padding:12px;margin-top:8px}
.raisebox .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.raisebox .presets button{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.82rem;cursor:pointer}
.raisebox input[type=range]{width:100%;accent-color:var(--raise)}
.raisebox .amt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.raisebox .amt b{font-family:var(--display);font-weight:800;font-size:1.5rem}
.waiting{text-align:center;color:var(--muted);padding:15px 10px;border-radius:16px;font-size:.95rem}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,8,7,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--solid);color:var(--text);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:none;max-width:560px;margin:0 auto}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
.tool{border-top:1px solid var(--line);padding:10px 0}
.tool .k{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tool .v{font-size:1.02rem}
.big{font-family:var(--display);font-weight:800;font-size:1.6rem}
.advice{background:var(--text);color:var(--solid);border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.advice b{color:var(--accent)}
.formula{background:rgba(201,154,59,.1);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:8px 12px;margin:6px 0;font-size:.92rem}
.reflist{list-style:none;padding:0;margin:4px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,auto);grid-auto-flow:column;gap:1px 20px}
.reflist li{font-family:var(--display);font-weight:700;font-size:1.1rem;padding:2px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.6em 1fr}
.reflist li.me{background:rgba(201,154,59,.2);border-radius:4px}
.hc{color:var(--accent);border-right:2px solid var(--accent);margin-right:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.beginner{background:var(--beg)}.dot.regular{background:var(--reg)}.dot.tough{background:var(--tgh)}
.log{font-size:.85rem;color:var(--muted);max-height:180px;overflow-y:auto;margin:0;padding-left:1.2em}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;background:var(--solid);color:var(--text);border-radius:22px;padding:20px;width:min(92vw,400px);box-shadow:0 4px 0 rgba(13,11,23,.45)}
#atm,#season{overflow:hidden}
html,body{overflow-x:clip}
.modal{overflow-x:hidden;box-sizing:border-box}
.modal *{min-width:0}
.modal select,.modal input[type=range]{max-width:100%}
.ctbl button{white-space:normal;overflow-wrap:anywhere}
.ctseats label{grid-template-columns:56px minmax(0,1fr)}
.modal{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.modal p{margin:8px 0 14px}

/* style picker */
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:.88rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--solid)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:2px solid transparent;border-radius:16px;padding:6px;background:transparent;cursor:pointer;text-align:center;font-size:.78rem;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(201,154,59,.08)}
.opt .pv{height:70px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:5px}
.opt .tv{width:92%;height:56px;border-radius:50%/50%;position:relative}
.preview{border-radius:20px;height:150px;position:relative;overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.preview .ptable{width:86%;height:110px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:12px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(13,11,23,.45);transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:23px}

/* world */
.ltabs{margin:4px 0 4px;position:sticky;top:6px;z-index:5;padding:6px;border-radius:16px;background:var(--surface);-webkit-backdrop-backdrop-border:1px solid var(--line)}
.prof .profrow{display:flex;gap:12px;align-items:center}
.lvl{flex:none;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--accent),#f3d27a);color:#1B1408;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1}
.lvl span{font-size:.6rem;letter-spacing:.12em}
.ttl{font-family:var(--display);font-weight:800;font-size:1.3rem}
.xpbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f3d27a);border-radius:999px}
.prof .bank{margin-top:14px}
.ev h2{font-size:1.25rem}
.ev.locked{opacity:.72}
.ev.active{box-shadow:0 0 0 2px var(--accent),0 4px 0 rgba(13,11,23,.45)}
.evtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.venue{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tier{flex:none;font-family:var(--display);font-weight:800;font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--text);color:var(--solid)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chips span{font-size:.8rem;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.evmeta{font-size:.85rem;margin-top:4px}
.lock{flex:1;text-align:center;padding:11px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:.9rem}
.trophies{display:grid;gap:8px;margin-top:8px}
.trophy{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(201,154,59,.1)}
.trophy .cup{font-size:1.6rem}
.achgrid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);opacity:.6}
.ach.on{opacity:1;border-color:var(--accent);background:rgba(201,154,59,.08)}
.ach .ai{font-size:1.2rem;color:var(--accent);line-height:1.2}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);z-index:20;background:var(--text);color:var(--solid);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem;box-shadow:0 4px 0 rgba(13,11,23,.45);opacity:0;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{animation:toastin 2.5s ease both}
@keyframes toastin{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
.opt[disabled]{opacity:.55;cursor:default}
.opt .lk{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.av svg{width:100%;height:100%;display:block}
.av.beginner{border-color:var(--beg)}.av.regular{border-color:var(--reg)}.av.tough{border-color:var(--tgh)}
.seat .plate{cursor:pointer}
.bubble{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);z-index:6;background:#fff;color:#141414;font-size:.72rem;font-weight:700;line-height:1.2;padding:6px 9px;border-radius:12px;width:max-content;max-width:150px;box-shadow:0 4px 0 rgba(13,11,23,.45);animation:pop .25s ease both}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.pcard{display:flex;gap:14px;align-items:center}
.pav{flex:none;width:96px;height:96px;border-radius:24px;overflow:hidden;box-shadow:0 4px 0 rgba(13,11,23,.45)}
.pav svg{width:100%;height:100%;display:block}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0 4px}
.lu{text-align:center;font-size:.68rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.luav{width:52px;height:52px;border-radius:14px;overflow:hidden}
.luav svg{width:100%;height:100%;display:block}
.theme{font-size:.82rem;margin-top:6px;padding:6px 10px;border-radius:10px;background:rgba(201,154,59,.12)}
input,select{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--text);min-width:0;flex:1 1 90px;font-size:1rem}
.ltabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:0 0 auto;padding:10px 14px}
.felt.ring9{height:404px}
.felt.ring9 .seat{width:84px;font-size:.66rem}
.felt.ring9 .av{width:24px;height:24px}
.felt.ring9 .center{top:146px}
.felt.ring9 .logo{top:74%}
.felt.ring9 .pc.sm,.felt.ring9 .slot{width:33px;height:46px}
.felt.ring9 .board{height:46px}
.flychip{position:absolute;z-index:7;width:18px;height:18px;border-radius:50%;background:var(--chip);border:3px dashed rgba(255,255,255,.7);box-shadow:0 4px 0 rgba(13,11,23,.45);transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .45s ease;pointer-events:none}
.chp{display:inline-flex;gap:3px;align-items:flex-end;vertical-align:bottom;margin-right:5px}
.chp.lg{gap:5px}
.cst{position:relative;display:inline-block}
.cst i{position:absolute;left:0;width:100%;border-radius:50%;background-color:var(--c);
  background-image:repeating-linear-gradient(90deg,transparent 0 16%,var(--e) 16% 24%);
  box-shadow:0 1px 0 rgba(0,0,0,.5),inset 0 -1px 0 rgba(0,0,0,.25)}

.cst i:last-child{background-image:radial-gradient(ellipse at center,var(--c) 0 38%,var(--e) 39% 47%,transparent 48%),repeating-linear-gradient(90deg,transparent 0 16%,var(--e) 16% 24%)}
.ckey{display:flex;flex-wrap:wrap;gap:4px 9px;justify-content:center;font-size:.68rem;font-weight:700;opacity:.85;margin-top:3px}
.ckey span{display:inline-flex;align-items:center;gap:3px}
.ckey i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px var(--e),0 0 0 1px rgba(0,0,0,.35)}
.cstacks{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;min-height:58px;margin:6px 0}

/* draw: fixed sizes so nothing jumps between states */
section#draw .felt{margin-top:6px}

:root,:root[data-theme]{

  --accent:#feae34;--raise:#e43b44;--good:#63c74d;--bad:#f6757a;
  --beg:#63c74d;--reg:#4db8ff;--tgh:#f6757a;
  --s-s:#c0cbdc;--s-h:#f6757a;--s-d:#4db8ff;--s-c:#63c74d;
  --display:"PXJ","Jersey 10","Pixelify Sans",system-ui,sans-serif;--body:"PXB","Pixelify Sans",system-ui,sans-serif;--j1:18.6667px;--j15:28px;--j2:37.3333px;--j4:74.6667px;
  --felt-text:#f4ecd8;--felt-muted:rgba(244,236,216,.75);
  --oct:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px);
  color-scheme:dark;image-rendering:pixelated;
}
*,*::before,*::after{border-radius:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;-webkit-tap-highlight-color:transparent}
html{background:var(--ink);overscroll-behavior:none;font-size:var(--j1)}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:1rem;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}

input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;border:0!important;border-image:none!important;padding:0;flex:1 1 auto}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#0d0b17;border:2px solid var(--ink);box-shadow:0 2px 0 var(--slate)}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:24px;margin-top:-10px;background:linear-gradient(var(--sun) 0 4px,var(--gold) 4px 16px,var(--amber) 16px);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:20px;background:var(--gold);border:2px solid var(--ink)}
input,select,.ctsel{border:6px solid transparent;border-image:var(--f-well) 3 fill/6px;background:none;color:var(--text);padding:5px 6px;font-family:var(--body)}
select,.ctsel{-webkit-appearance:none;appearance:none;padding-right:22px;background:linear-gradient(var(--gold),var(--gold)) right 6px top 50%/10px 2px no-repeat,linear-gradient(var(--gold),var(--gold)) right 8px top calc(50% + 2px)/6px 2px no-repeat,linear-gradient(var(--gold),var(--gold)) right 10px top calc(50% + 4px)/2px 2px no-repeat}
select option{background:var(--night);color:var(--text)}

/* overlays */

  if(left<=0){if(t.level<lv.length-1){t.level++;t.end=Date.now()+t.mins*60000;sfx("alarm");buzz([200,100,200]);toast("Blinds up: "+lv[t.level][0]+"/"+lv[t.level][1]);}else{t.running=false;t.left=0;}save();}
  var el=$("tm-clock");if(el)renderTimer();}
function ensureTimer(){if(!TIMER_INT)TIMER_INT=setInterval(timerTick,500);}
function fmt(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;return m+":"+(s<10?"0":"")+s;}
function renderTimer(){

  var el=$("tm-box");if(!el)return;

    "<div class='row'><button class='btn ghost' id='tm-prev' style='flex:1 1 0'>Prev</button><button class='btn "+(t.running?"ghost":"brass")+"' id='tm-go' style='flex:1.4 1 0'>"+(t.running?"Pause":"Start")+"</button><button class='btn ghost' id='tm-next' style='flex:1 1 0'>Next</button></div>"+
    "<div class='row'><select id='tm-preset'>"+Object.keys(TIMER_PRESETS).map(function(k){return "<option value='"+k+"'"+(k===t.preset?" selected":"")+">"+TIMER_PRESETS[k].n+"</option>";}).join("")+"</select><select id='tm-mins'>"+[5,10,12,15,20,30].map(function(m){return "<option"+(m===t.mins?" selected":"")+">"+m+"</option>";}).join("")+"</select><span class='muted' style='align-self:center'>min levels</span><button class='btn ghost pill' id='tm-reset'>Reset</button></div>";

  $("tm-prev").onclick=function(){t.level=Math.max(0,t.level-1);t.left=t.mins*60000;if(t.running)t.end=Date.now()+t.left;save();renderTimer();};
  $("tm-next").onclick=function(){t.level=Math.min(P.lv.length-1,t.level+1);t.left=t.mins*60000;if(t.running)t.end=Date.now()+t.left;save();renderTimer();};
  $("tm-preset").onchange=function(){t.preset=this.value;t.level=0;t.left=t.mins*60000;t.running=false;save();renderTimer();};
  $("tm-mins").onchange=function(){t.mins=+this.value;t.left=t.mins*60000;t.running=false;save();renderTimer();};
  $("tm-reset").onclick=function(){t.level=0;t.left=t.mins*60000;t.running=false;save();renderTimer();};
}
function calcRender(){
  var pot=+$("cl-pot").value||0,bet=+$("cl-bet").value||0,outs=+$("cl-outs").value||0,cards=+$("cl-cards").value||1,out=[];
  if(bet>0){var need=bet/(pot+2*bet);out.push("Equity needed to call: "+bet+" \u00f7 ("+pot+" + 2 \u00d7 "+bet+") = <b>"+p1(need)+"</b>");}
  if(outs>0){var unseen=cards===2?47:46,e=cards===2?1-((unseen-outs)*(unseen-outs-1))/(unseen*(unseen-1)):outs/unseen;out.push("Hit chance: "+(cards===2?"1 \u2212 ("+(unseen-outs)+"/"+unseen+" \u00d7 "+(unseen-outs-1)+"/"+(unseen-1)+")":outs+" \u00f7 "+unseen)+" = <b>"+p1(e)+"</b>");
    if(bet>0)out.push(e>=need?"<b>Call.</b> Your odds of hitting beat what the bet asks for.":"<b>Fold</b>, unless you expect to win a lot more when you hit.");}
  $("cl-out").innerHTML=out.length?out.join("<br>"):"<span class='muted'>Enter the pot and bet, and your outs if you're drawing.</span>";
}
function settle(players){
  var bal=players.map(function(p){var ins=p.ins.reduce(function(a,b){return a+b;},0);return {n:p.n,v:(p.out||0)-ins};});
  var tot=bal.reduce(function(a,b){return a+b.v;},0),pos=bal.filter(function(b){return b.v>0.004;}).sort(function(a,b){return b.v-a.v;}),neg=bal.filter(function(b){return b.v<-0.004;}).sort(function(a,b){return a.v-b.v;}),tx=[];
  var i=0,j=0;while(i<pos.length&&j<neg.length){var a=Math.min(pos[i].v,-neg[j].v);tx.push(neg[j].n+" pays "+pos[i].n+" $"+a.toFixed(2).replace(/\.00$/,""));pos[i].v-=a;neg[j].v+=a;if(pos[i].v<0.005)i++;if(neg[j].v>-0.005)j++;}
  return {tx:tx,off:tot};
}

function sessionChart(ss){

  var mn=Math.min(0,Math.min.apply(null,pts)),mx=Math.max(0,Math.max.apply(null,pts)),W=320,Hh=110,sx=W/(pts.length-1),sy=function(v){return Hh-8-(v-mn)/((mx-mn)||1)*(Hh-16);};
  var d=pts.map(function(v,i){return (i?"L":"M")+(i*sx).toFixed(1)+" "+sy(v).toFixed(1);}).join(" ");
  return "<svg viewBox='0 0 "+W+" "+Hh+"' style='width:100%;height:auto;margin-top:8px' role='img' aria-label='Running results'><line x1='0' x2='"+W+"' y1='"+sy(0)+"' y2='"+sy(0)+"' stroke='currentColor' stroke-opacity='.2' stroke-dasharray='4 4'/><path d='"+d+"' fill='none' stroke='"+(run>=0?"#2E8B57":"#C23B2E")+"' stroke-width='2.5' stroke-linejoin='round'/></svg>";
}

function dwSimHTML(){var rows=[["Pair of 2s to 7s","p-5"],["Pair of 8s","p-8"],["Pair of jacks","p-J"],["Pair of queens","p-Q"],["Pair of kings","p-K"],["Pair of aces","p-A"],["Two pair, low","2p-low"],["Two pair, aces up","2p-A"],["Three of a kind","trips"],["Four to a flush","4flush"],["Open-ended straight draw","openend"],["Ace high","A-high"]];
