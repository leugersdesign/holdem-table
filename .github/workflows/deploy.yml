name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull in a new build if one is queued
        if: hashFiles('.build-source') != ''
        run: |
          BUILD_URL=$(sed -n 1p .build-source)
          BUILD_SHA256=$(sed -n 2p .build-source)
          curl -fsSL "$BUILD_URL" -o build.txt
          base64 -d build.txt > build.zip
          echo "$BUILD_SHA256  build.zip" | sha256sum -c -
          unzip -o build.zip
          cp -r holdem-table/. .
          rm -rf holdem-table build.zip build.txt .build-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply queued build"
          git push

      - uses: actions/configure-pages@v5

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest *.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
